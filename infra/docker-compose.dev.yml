# Development infrastructure for SeatFlow.
#
# Runs inside WSL (Docker Desktop is disabled on this machine). The Spring Boot
# app runs on Windows and reaches these over WSL2 localhost forwarding.
# See README-wsl.md for the commands and docs/VERIFY.md part 1 to prove it works.

name: seatflow-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatflow-postgres
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: seatflow
      POSTGRES_PASSWORD: seatflow
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatflow -d seatflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seatflow-redis
    # Keyspace notifications for expired keys: used from Phase 5 as a hint to the
    # expiry sweeper. Correctness never depends on these firing.
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Apache Kafka in KRaft mode - no ZooKeeper. Domain events published out of the
  # transactional outbox land here; see docs/CONCURRENCY.md part 8.
  kafka:
    image: apache/kafka:4.1.0
    container_name: seatflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertised as 127.0.0.1 because the only client in this file's world is
      # the Spring app running on Windows, reaching in over the WSL2 relay. A
      # broker advertises where clients should reconnect, so naming the
      # container here would send the Windows JVM somewhere it cannot resolve.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker, so nothing can be replicated further than that.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Do not sit on a new consumer group for three seconds before assigning it
      # partitions. That default is for large production clusters.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed, so restarting the broker does not orphan its own log directory.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
