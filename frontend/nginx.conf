# Serves the built app and proxies the API on the same origin.
#
# Same-origin is the point. The browser only ever talks to this server, so there
# is no cross-origin request and therefore no CORS policy to get wrong - the
# same arrangement the Vite dev proxy provides in development.

upstream seatflow_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://seatflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live seat feed. The Upgrade headers are what turn this from a proxied
    # HTTP request into a WebSocket; without them the handshake never completes
    # and the seat map silently stops updating.
    location /ws {
        proxy_pass http://seatflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A socket with no traffic must not be reaped while a user reads the map.
        proxy_read_timeout 3600s;
    }

    # API reference, proxied so it is reachable on the same origin as everything else.
    location ~ ^/(docs|swagger-ui|v3/api-docs) {
        proxy_pass http://seatflow_backend;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths are routes, not missing files. Without this
    # a refresh on /events/<id>/seats returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
