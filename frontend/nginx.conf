# Serves the built app and proxies the API on the same origin.
#
# Same-origin is the point. The browser only ever talks to this server, so there
# is no cross-origin request and therefore no CORS policy to get wrong - the
# same arrangement the Vite dev proxy provides in development.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required for the runtime resolution below.
    #
    # `docker compose up --scale backend=3` makes "backend" resolve to three
    # addresses, and Docker returns them in a different order each query. The
    # usual `upstream { server backend:8080; }` block cannot use that: nginx
    # resolves an upstream once, at startup, and keeps the single address it got
    # for the life of the process. Everything would go to whichever container
    # happened to answer first, the other two would sit idle, and scaling would
    # look like it worked while doing nothing at all.
    #
    # Naming the host in a variable forces re-resolution instead, and the short
    # TTL means a replaced container is picked up rather than proxied to until
    # someone reloads nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $seatflow_backend "backend:8080";

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://$seatflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live seat feed. The Upgrade headers are what turn this from a proxied
    # HTTP request into a WebSocket; without them the handshake never completes
    # and the seat map silently stops updating.
    #
    # No sticky sessions, deliberately. A WebSocket is one long-lived connection
    # that stays on whichever instance answered the handshake, and every instance
    # receives every seat update over the Redis fan-out channel - so it does not
    # matter which one a client lands on. Needing stickiness here would mean the
    # fan-out was broken.
    location /ws {
        proxy_pass http://$seatflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A socket with no traffic must not be reaped while a user reads the map.
        proxy_read_timeout 3600s;
    }

    # API reference, proxied so it is reachable on the same origin as everything else.
    location ~ ^/(docs|swagger-ui|v3/api-docs) {
        proxy_pass http://$seatflow_backend;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths are routes, not missing files. Without this
    # a refresh on /events/<id>/seats returns 404 from nginx.
    #
    # Note the consequence, which has cost time before: an unproxied path such as
    # /actuator/prometheus returns 200 with index.html rather than 404. Check the
    # body, not the status code.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
