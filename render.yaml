# Render Blueprint: the backend, a PostgreSQL instance, and a Redis.
#
# In the Render dashboard: New -> Blueprint -> pick this repository. Everything
# below is created and wired together; the only thing to supply by hand is the
# admin password, which is marked sync:false so it is never committed.
#
# The frontend is not here. It is a static bundle and goes to Vercel, which
# rewrites /api to this service so the browser stays same-origin. See
# vercel.json.
#
# What this deployment gives up, and why it is safe to give up:
#
#   No Kafka.  Free tiers do not offer a broker. Domain events are still
#              recorded to the outbox table in the same transaction as the
#              booking - only the relay is off. docs/VERIFY.md part 12 measures
#              exactly this state: the full checkout suite passes with the
#              broker stopped, and the backlog drains when one appears.
#
#   One instance. The multi-instance work is real and verified, but a free tier
#              gives one container. docker-compose.yml is where the scaled
#              arrangement lives.

databases:
  - name: seatflow-db
    databaseName: seatflow
    user: seatflow
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: seatflow-redis
    plan: free
    # Only the backend talks to it, and it holds nothing authoritative.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: seatflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud

      # Assembled into a JDBC URL by application-cloud.yml, because Render
      # hands out a postgres:// connection string and Spring wants jdbc:.
      - key: SEATFLOW_DB_HOST
        fromDatabase:
          name: seatflow-db
          property: host
      - key: SEATFLOW_DB_PORT
        fromDatabase:
          name: seatflow-db
          property: port
      - key: SEATFLOW_DB_NAME
        fromDatabase:
          name: seatflow-db
          property: database
      - key: SEATFLOW_DB_USER
        fromDatabase:
          name: seatflow-db
          property: user
      - key: SEATFLOW_DB_PASSWORD
        fromDatabase:
          name: seatflow-db
          property: password

      - key: SEATFLOW_REDIS_URL
        fromService:
          name: seatflow-redis
          type: keyvalue
          property: connectionString

      # Generated by Render and never seen by anyone, which is the right
      # treatment for a signing key. JwtProperties refuses to start on anything
      # shorter than 32 bytes.
      - key: SEATFLOW_JWT_SECRET
        generateValue: true

      - key: SEATFLOW_ADMIN_EMAIL
        value: admin@seatflow.local
      # Set once, in the dashboard. Not generated, because you need to know it
      # to reach the admin endpoints.
      - key: SEATFLOW_ADMIN_PASSWORD
        sync: false
