# The whole system, from nothing.
#
#   docker compose up --build
#   open http://localhost:8088
#
# This is the full stack, unlike infra/docker-compose.dev.yml which starts only
# the databases so the backend and frontend can run from an IDE.
#
# On this machine Docker lives in WSL, so run it from there. See docs/VERIFY.md.

name: seatflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: seatflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatflow}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatflow -d seatflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published. Nothing outside this network has any business reaching the
    # database directly.
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"
    restart: unless-stopped

  # Apache Kafka in KRaft mode - no ZooKeeper node to run alongside it.
  #
  # Not published, like everything else except nginx. Nothing outside this
  # network needs to produce to it, and an open broker is an open door.
  #
  # No volume, deliberately. The durable record of what happened is the outbox
  # table in PostgreSQL; the broker is the transport. Losing this log loses
  # messages already handed over, not events - which is a real limitation, and
  # the reason a production deployment gives it a volume and replicas. See the
  # Known limits section of the README.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The service name, because every client is a container on this network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SEATFLOW_DB_URL: jdbc:postgresql://postgres:5432/seatflow
      SEATFLOW_DB_USER: seatflow
      SEATFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-seatflow}
      SEATFLOW_REDIS_HOST: redis
      SEATFLOW_KAFKA_BOOTSTRAP: kafka:9092
      # No default. The application refuses to start without one rather than
      # falling back to something guessable - see JwtProperties.
      SEATFLOW_JWT_SECRET: ${SEATFLOW_JWT_SECRET:?set SEATFLOW_JWT_SECRET, at least 32 characters}
      SEATFLOW_ADMIN_EMAIL: ${SEATFLOW_ADMIN_EMAIL:-admin@seatflow.local}
      SEATFLOW_ADMIN_PASSWORD: ${SEATFLOW_ADMIN_PASSWORD:?set SEATFLOW_ADMIN_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      # Waits for healthy, not merely started. Flyway runs at boot and a
      # database that is still initialising would fail the migration.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started, not service_healthy, and that is the whole argument in
      # one line: the application must come up and sell tickets whether or not
      # the broker is ready. Domain events go to a table first, so a broker that
      # is slow, or down, or still electing itself delays delivery and nothing
      # else. Waiting for it here would put Kafka on the startup path and make a
      # message broker able to keep the box office shut.
      kafka:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    # The only published port. Everything else is reachable only from inside
    # this network, and nginx proxies /api and /ws to the backend so the browser
    # stays same-origin and CORS never enters the picture.
    ports:
      - "${SEATFLOW_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
