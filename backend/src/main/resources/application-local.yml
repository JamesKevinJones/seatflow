# Local development profile. Never used outside a developer machine.
#
# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Infrastructure comes from infra/docker-compose.dev.yml, running in WSL.

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

seatflow:
  # Development administrator, so a fresh clone can reach admin endpoints with no
  # setup. Local profile only. Real environments supply their own via
  # SEATFLOW_ADMIN_EMAIL / SEATFLOW_ADMIN_PASSWORD.
  admin:
    email: admin@seatflow.local
    password: local-admin-password-change-me
    full-name: Local Administrator

  security:
    jwt:
      # Development-only key. Long enough for HMAC-SHA256 (needs >= 256 bits).
      # Production reads SEATFLOW_JWT_SECRET from the environment; this default
      # exists so a fresh clone runs without setup. It is not a secret.
      secret: local-development-only-signing-key-do-not-use-anywhere-else-0123456789

logging:
  level:
    com.seatflow: DEBUG
    org.springframework.security: DEBUG
    # Uncomment to see the SQL behind the reservation path.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
