# Test profile. Layered on top of application.yml, not a replacement for it.
#
# Datasource and Redis settings are absent on purpose: Testcontainers supplies
# them at runtime through @ServiceConnection.

spring:
  datasource:
    hikari:
      # The concurrency test fires 200 simultaneous reservations. With the
      # production pool of 20 they would queue behind each other and some would
      # hit the 3s connection timeout, which would surface as a failure that has
      # nothing to do with seat arbitration. A wider pool and a patient timeout
      # keep the test measuring what it claims to measure.
      maximum-pool-size: 40
      connection-timeout: 20000

seatflow:
  reservation:
    # The sweeper must not run during tests: it would release lapsed holds
    # behind the assertions that check lapsed holds are still claimable.
    # Tests exercise expiry directly instead.
    sweep-initial-delay-ms: 86400000
    sweep-interval-ms: 86400000

  outbox:
    # Fast, so a test can wait a beat and find the message on Kafka rather than
    # sleeping for the production half-second-plus-five-second start-up delay.
    poll-interval-ms: 200
    initial-delay-ms: 200
    # Retention must not run during tests: it would delete the published rows
    # the assertions are about.
    retention-initial-delay-ms: 86400000
    retention-sweep-ms: 86400000

  messaging:
    # Distinct from production so a developer running both against one broker
    # does not have the test suite stealing the application's messages.
    consumer-group: seatflow-test

  admin:
    # Configured so MultiInstanceIT can race the bootstrap runner. Without an
    # admin configured the runner returns immediately and the test would pass
    # while proving nothing.
    email: bootstrap-race@seatflow.test
    password: test-only-admin-password
    full-name: Bootstrap Race Tester

  security:
    jwt:
      # Fixed so token assertions are reproducible across runs.
      secret: test-profile-signing-key-not-used-outside-the-test-suite-0123456789
      access-token-ttl: 5m
      refresh-token-ttl: 1d

logging:
  level:
    com.seatflow: DEBUG
    org.testcontainers: INFO
    # Testcontainers is chatty about image pulls on a cold cache.
    tc: INFO
